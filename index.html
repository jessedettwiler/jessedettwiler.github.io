  <script type="application/ld+json">

  "@context": "https://schema.org",

</script>
  
</head>

<body>

  <header class="site-header">
    <a href="index.html" class="brand" aria-label="C4C home">
      <img src="images/c4c-logo.png" alt="C4C logo">

    <!-- Desktop menu -->
    <nav class="nav-right nav-desktop" aria-label="Main menu">

    <!-- Mobile hamburger -->
    <button
      class="nav-toggle"
      type="button"
      aria-label="Open menu"
      aria-controls="mobile-menu"
      aria-expanded="false">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>

    <img class="splash-img" src="images/folksoul.jpg" alt="" aria-hidden="true">
    <div class="splash-overlay" aria-hidden="true"></div>
  </section>

  <div class="home-icons-overlay" aria-label="Links">
    <a href="https://open.spotify.com/artist/5jZeLexrrwGNUy6nv7tzdr" target="_blank" rel="noopener" aria-label="Spotify">

    </a>

    <a href="mailto:hello@c4cmusic.com" aria-label="Email">
      <img src="images/icons/envelope.svg" alt="" aria-hidden="true">
    </a>
  </div>

  
  <script>
    document.documentElement.classList.add("js");

    const contactSection = document.querySelector("#contact");

    if (contactSection && "IntersectionObserver" in window) {
      const observer = new IntersectionObserver(
        (entries) => {
          for (const entry of entries) {
            if (entry.isIntersecting) {
              contactSection.classList.add("is-visible");
              observer.disconnect();
              break;
            }
          }
        },
        { threshold: 0, rootMargin: "-100% 0px 0px 0px" }
      );

      observer.observe(contactSection);
    } else if (contactSection) {
      contactSection.classList.add("is-visible");
    }
  </script>

  <script src="main.js" defer></script>
</body>
</html>
